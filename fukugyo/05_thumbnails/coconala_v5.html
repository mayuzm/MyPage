<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ココナラ出品画像 v5</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1b3a5c;--gray:#5d6670}
  *{box-sizing:border-box}
  body{margin:0;background:#777;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--navy);font-weight:400}
  .board{position:relative;overflow:hidden;margin:20px;width:1220px;height:1240px;background:#fff}
  .ph{position:absolute;background-size:cover;background-position:center}
</style>
</head>
<body>

<!-- 1. MAIN : 主役＝見出し -->
<div class="board" id="cc_main">
  <div class="ph" style="left:0;right:0;top:0;height:900px;background-image:url(photos/boats.jpg);background-position:28% 30%"></div>
  <div class="ph" style="left:0;right:0;top:500px;height:400px;background:linear-gradient(180deg,rgba(10,30,50,0) 0%,rgba(10,30,50,.5) 50%,rgba(10,30,50,.55) 100%)"></div>
  <div style="position:absolute;left:80px;top:560px;color:#fff;text-shadow:0 2px 12px rgba(0,20,40,.35);font-size:150px;font-weight:700;line-height:1.08;white-space:nowrap">全員の希望を、<br>行程表に。</div>
  <div style="position:absolute;left:80px;top:928px;font-size:72px;font-weight:500;line-height:1.2;white-space:nowrap">言いにくい本音も匿名で集めます</div>
</div>

<!-- 2. SAMPLE : 主役＝スマホの画面 -->
<div class="board" id="cc_sample">
  <div style="position:absolute;left:0;right:0;top:167px;text-align:center;font-size:64px;font-weight:700">こんな行程表が届きます</div>
  <div style="position:absolute;left:0;right:0;top:257px;text-align:center;font-size:34px;font-weight:500;color:var(--gray)">見本：北海道・道東 4泊5日・友人4人</div>
  <div style="position:absolute;left:146px;top:320px;width:318px;height:688px;background:#111;border-radius:48px;padding:14px">
    <div style="width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff"><img src="../04_sample_itinerary/web_phone_day1_tall.png" style="display:block;width:100%"></div>
  </div>
  <svg width="1220" height="1240" style="position:absolute;left:0;top:0" fill="none" stroke="#1b3a5c" stroke-width="2.5">
    <circle cx="214" cy="346" r="7" fill="#1b3a5c"/><polyline points="214,346 214,306 560,306 560,374 600,374"/>
    <circle cx="208" cy="583" r="7" fill="#1b3a5c"/><polyline points="208,583 560,583 560,602 600,602"/>
    <circle cx="340" cy="741" r="7" fill="#1b3a5c"/><polyline points="340,741 600,741"/>
  </svg>
  <div style="position:absolute;left:620px;top:352px;width:560px"><div style="font-size:36px;font-weight:500">日ごとにタブで切り替え</div><div style="font-size:30px;font-weight:500;color:var(--gray);margin-top:6px">見たい日をすぐに開けます</div></div>
  <div style="position:absolute;left:620px;top:580px;width:560px"><div style="font-size:36px;font-weight:500">大事な時刻はひと目でわかる</div><div style="font-size:30px;font-weight:500;color:var(--gray);margin-top:6px">当日、ここだけ見れば迷いません</div></div>
  <div style="position:absolute;left:620px;top:719px;width:560px"><div style="font-size:36px;font-weight:500">場所名をタップすると地図へ</div><div style="font-size:30px;font-weight:500;color:var(--gray);margin-top:6px">そのままナビとして使えます</div></div>
</div>

<!-- 3. FLOW : 主役＝見出し -->
<div class="board" id="cc_flow">
  <div class="ph" style="left:0;top:0;bottom:0;width:620px;background-image:url(photos/road.jpg);background-position:50% 40%"></div>
  <div style="position:absolute;left:680px;right:60px;top:290px">
    <div style="font-size:34px;font-weight:500;color:var(--gray)">ご依頼の流れ</div>
    <div style="font-size:80px;font-weight:700;line-height:1.2;margin-top:10px">幹事さんが<br>やることは<br>3つ。</div>
    <div style="margin-top:64px">
      <div style="display:grid;grid-template-columns:52px 1fr;align-items:baseline;padding:26px 0;border-top:1px solid #c9d3dc;"><span style="font-size:36px;font-weight:500;color:var(--gray)">1</span><span style="font-size:36px;font-weight:500">質問に答える</span></div>
      <div style="display:grid;grid-template-columns:52px 1fr;align-items:baseline;padding:26px 0;border-top:1px solid #c9d3dc;"><span style="font-size:36px;font-weight:500;color:var(--gray)">2</span><span style="font-size:36px;font-weight:500">アンケートをLINEに貼る</span></div>
      <div style="display:grid;grid-template-columns:52px 1fr;align-items:baseline;padding:26px 0;border-top:1px solid #c9d3dc;border-bottom:1px solid #c9d3dc;"><span style="font-size:36px;font-weight:500;color:var(--gray)">3</span><span style="font-size:36px;font-weight:500">行程表をみんなに送る</span></div>
    </div>
  </div>
</div>

<!-- 4. WHAT YOU GET : 主役＝見出し -->
<div class="board" id="cc_items">
  <div class="ph" style="left:0;top:0;bottom:0;width:560px;background-image:url(photos/pond.jpg);background-size:auto 125%;background-position:38% 38%"></div>
  <div style="position:absolute;left:615px;right:30px;top:300px">
    <div style="font-size:34px;font-weight:500;color:var(--gray)">セット内容</div>
    <div style="font-size:80px;font-weight:700;line-height:1.2;white-space:nowrap;margin-top:10px">お届けするもの</div>
    <div style="margin-top:56px">
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;padding:20px 0;border-top:1px solid #c9d3dc;"><span style="width:10px;height:10px;background:#1b3a5c;transform:translateY(2px)"></span><span style="font-size:32px;font-weight:500;line-height:1.4">スマホで見るWeb版の行程表</span></div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;padding:20px 0;border-top:1px solid #c9d3dc;"><span style="width:10px;height:10px;background:#1b3a5c;transform:translateY(2px)"></span><span style="font-size:32px;font-weight:500;line-height:1.4">印刷用のPDF</span></div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;padding:20px 0;border-top:1px solid #c9d3dc;"><span style="width:10px;height:10px;background:#1b3a5c;transform:translateY(2px)"></span><span style="font-size:32px;font-weight:500;line-height:1.4">費用の目安と予約の一覧</span></div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;padding:20px 0;border-top:1px solid #c9d3dc;"><span style="width:10px;height:10px;background:#1b3a5c;transform:translateY(2px)"></span><span style="font-size:32px;font-weight:500;line-height:1.4">雨の日の案</span></div>
      <div style="display:grid;grid-template-columns:30px 1fr;align-items:center;padding:20px 0;border-top:1px solid #c9d3dc;border-bottom:1px solid #c9d3dc;"><span style="width:10px;height:10px;background:#1b3a5c;transform:translateY(2px)"></span><span style="font-size:32px;font-weight:500;line-height:1.4">Googleマップのリスト</span></div>
    </div>
  </div>
</div>

</body>
</html>
